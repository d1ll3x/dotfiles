name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  mise-install:
    runs-on: ubuntu-latest
    env:
      # Same file real machines use as their global config
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # avoids GitHub API rate limits
    steps:
      - uses: actions/checkout@v7

      # Runs `mise install`: fails on a missing version or bad checksum
      - uses: jdx/mise-action@v5

      # Runs every program mise installed (no tool list to maintain). Catches binaries
      # that install but don't run: wrong arch/libc, renamed asset.
      - name: Smoke test
        run: |
          checked=0
          for dir in $(mise bin-paths); do
            for bin in "$dir"/*; do
              [ -f "$bin" ] && [ -x "$bin" ] || continue
              mise exec -- timeout 10 "$bin" --version </dev/null >/dev/null 2>&1 \
                || { echo "FAIL: $bin"; exit 1; }
              echo "ok: ${bin##*/}"
              checked=$((checked + 1))
            done
          done
          # Guard against a vacuous pass if bin-paths ever comes back empty
          [ "$checked" -gt 0 ] || { echo "FAIL: no binaries found"; exit 1; }
