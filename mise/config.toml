# Global mise config: ~/.config/mise is a link to this folder.
[settings]
# Auto-update: mise updates itself first, then every global tool on `latest`.
# Exact pins are left alone: Renovate bumps those.
self_update.auto = true
tool_update.self_update_first = true
tool_update.global_auto = true
# Lock versions and checksums in mise.lock
lockfile = true
# dotfiles lives where ghq would place it
dotfiles.root = "{{ env.HOME }}/projects/github.com/d1ll3x/dotfiles"

[tools]
# CLI Tools
bat = "0.26.1"
btop = "1.4.8"
zoxide = "0.10.0"
fd = "10.5.2"
fzf = "0.75.0"
ripgrep = "16.0.0"
eza = "0.23.5"
starship = "1.27.0"
jq = "1.8.2"
lazygit = "0.66.3"
neovim = "0.12.6"
github-cli = "2.106.0"
ghq = "1.12.0"
herdr = "0.9.5"

# Runtime
node = "26.13.0" # LTS - required by neovim
